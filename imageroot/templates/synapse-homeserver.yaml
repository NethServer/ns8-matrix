server_name: ${SYNAPSE_DOMAIN_NAME}
pid_file: /data/homeserver.pid
public_baseurl: https://${SYNAPSE_DOMAIN_NAME}/

listeners:
  - port: ${SYNAPSE_PORT}
    tls: false
    type: http
    x_forwarded: true
    # Published traffic reaches the pod address, not its loopback. Only the node 127.0.0.1 port is published.
    bind_addresses: ['0.0.0.0']
    resources:
      - names: [${SYNAPSE_LISTENER_RESOURCES}]

database:
  name: psycopg2
  txn_limit: 10000
  args:
    user: postgres
    password: ${POSTGRES_PASSWORD}
    database: synapse
    host: 127.0.0.1
    port: 5432
    cp_min: 5
    cp_max: 10

log_config: "/data/config/log.config"

media_store_path: /data/media_store
uploads_path: /data/uploads

max_upload_size: ${SYNAPSE_MAX_UPLOAD_SIZE}
max_image_pixels: 32M

dynamic_thumbnails: false

url_preview_enabled: false

enable_registration: false

# Federation is optional. When enabled, other servers find us through
# /.well-known/matrix/server on port 443, so port 8448 is not needed.
serve_server_wellknown: ${SYNAPSE_SERVE_SERVER_WELLKNOWN}
federation_domain_whitelist: ${SYNAPSE_FEDERATION_WHITELIST}

media_retention:
  local_media_lifetime: ${SYNAPSE_LOCAL_MEDIA_LIFETIME}
  remote_media_lifetime: ${SYNAPSE_REMOTE_MEDIA_LIFETIME}

# When true, users find every LDAP colleague, not only people they already share a room with
user_directory:
  search_all_users: ${SYNAPSE_SEARCH_ALL_USERS}
  prefer_local_users: true

turn_uris: ${SYNAPSE_TURN_URIS}
turn_shared_secret: ${SYNAPSE_TURN_SHARED_SECRET}
turn_user_lifetime: 1h
turn_allow_guests: false

report_stats: false

macaroon_secret_key: ${MACAROON_SECRET}
form_secret: ${FORM_SECRET}
signing_key_path: "/data/${SYNAPSE_DOMAIN_NAME}.signing.key"

# Email configuration for notifications
email:
  enable_notifs: ${SYNAPSE_SMTP_ENABLED}
  smtp_host: ${SYNAPSE_SMTP_HOST}
  smtp_port: ${SYNAPSE_SMTP_PORT}
  smtp_user: ${SYNAPSE_SMTP_USERNAME}
  smtp_pass: ${SYNAPSE_SMTP_PASSWORD}
  require_transport_security: ${SYNAPSE_SMTP_REQUIRE_TRANSPORT_SECURITY}
  notif_from: ${SYNAPSE_SMTP_FROM}
  app_name: "Matrix Chat"
  enable_tls: ${SYNAPSE_SMTP_REQUIRE_TRANSPORT_SECURITY}

# LDAP auth configuration using matrix-synapse-ldap3
# This listener will allow authentication against an LDAP server.
modules:
  - module: "ldap_auth_provider.LdapAuthProviderModule"
    config:
      enabled: true
      uri: "ldap://${LDAP_HOST}:${LDAP_PORT}"
      start_tls: false
      base: "${LDAP_BASE_DN}"
      bind_dn: ${LDAP_BIND_DN}
      bind_password: ${LDAP_BIND_PASSWORD}
      attributes:
        uid: "${LDAP_USERNAME}"
        mail: "${LDAP_EMAIL_ATTR}"
        name: "${LDAP_NAME_ATTR}"

suppress_key_server_warning: true
